<!doctype html>
<!--
  Borsa Patronu - web surumunun sayfa kabugu (emscripten "shell file").
  Tuval sayfanin (itch.io'da iframe'in) TAMAMINI kaplar; oyun sahnesinin boyutunu
  bu alanin en-boy oranina gore secer (genis pencerede genis sahne, telefonda dikey
  yerlesim), yani yanlarda bosluk kalmaz. itch.io ayari: "Embed in page",
  1280 x 720, "Fullscreen button" ve "Mobile friendly" acik.
-->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Borsa Patronu</title>
  <meta name="description" content="Borsa Patronu - tarayıcıda oynanan borsa yönetim oyunu. A stock market tycoon game you can play in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Borsa Patronu">
  <meta property="og:description" content="Haberi oku, 5 saniye içinde karar ver, borsa imparatorluğunu kur. Read the news, decide in 5 seconds, build your market empire.">
  <meta property="og:image" content="https://emrebiltekin.me/borsa-patronu/kapak.png">
  <link rel="icon" href="favicon.ico">
  <style>
    /* Telefon: sayfa kaymasin, yakinlasmasin, metin secilmesin; dokunuslar oyuna gitsin. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0e1117; overflow: hidden;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                 -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* 100dvh: telefonda adres cubugu gorunup kaybolunca tuval gorunen alani izler
       (desteklemeyen tarayici bir ustteki 100vh satirini kullanir). Tuvalin piksel
       boyutu bu kutudan okunur (bkz. platform.h, js_tuval_hedef_boyutu). */
    canvas.emscripten { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
                        outline: none; touch-action: none; }
    #durum { position: absolute; left: 0; right: 0; top: 44%; text-align: center; color: #ffcb00;
             font: 600 20px system-ui, sans-serif; letter-spacing: 1px; }
    #hata { position: absolute; left: 10%; right: 10%; top: 54%; text-align: center; color: #ef476f;
            font: 14px system-ui, sans-serif; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="durum">Yükleniyor… / Loading…</div>
  <div id="hata"></div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (metin) {
        if (!metin) document.getElementById('durum').style.display = 'none';
      },
      onRuntimeInitialized: function () {
        document.getElementById('durum').style.display = 'none';
      },
      onAbort: function (neden) {
        document.getElementById('durum').style.display = 'none';
        document.getElementById('hata').textContent =
          'Oyun baslatilamadi / The game could not start.\n' + (neden || '');
      }
    };
    // TEST MODU: adrese "?zamanlayici" eklenirse kareler requestAnimationFrame
    // yerine zamanlayiciyla uretilir. Tarayici, GORUNMEYEN bir sayfada
    // requestAnimationFrame'i hic cagirmaz; otomatik testler (gizli sekme/panel)
    // oyunu ancak bu modda ilerletebilir. Normal oyuncuyu etkilemez.
    if (location.search.indexOf('zamanlayici') >= 0) {
      window.requestAnimationFrame = function (f) {
        return setTimeout(function () { f(performance.now()); }, 16);
      };
      window.cancelAnimationFrame = function (id) { clearTimeout(id); };
    }
    // Klavye kisayollari (Bosluk, 1-8, M) icin tuvalin odakta olmasi gerekir;
    // iframe icinde ilk tiklamada odagi tuvale ver. Bosluk tusu sayfayi kaydirmasin.
    window.addEventListener('mousedown', function () {
      window.focus();
      document.getElementById('canvas').focus();
    });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space') e.preventDefault();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
